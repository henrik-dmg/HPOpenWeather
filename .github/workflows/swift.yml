name: Swift

on:
  push:
    branches: [main]
    paths:
      - "Sources/**/*.swift"
      - "Tests/**/*.swift"
  pull_request:
    branches: [main]
    paths:
      - "Sources/**/*.swift"
      - "Tests/**/*.swift"

jobs:
  test-swift:
    name: Test Swift Code
    runs-on: xcode-27
    steps:
      - name: Configure Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27'
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-
      - name: Build
        run: swift build -v
      - name: Run tests
        run: swift test --enable-code-coverage -v
        env:
          API_KEY: ${{ secrets.API_KEY }}
      - name: Convert coverage report
        continue-on-error: true
        run: Scripts/convert-coverage-report --target HPOpenWeatherPackageTests
      - name: Upload coverage reports to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: henrik-dmg/HPOpenWeather

  lint-code:
    name: Lint Swift Code
    runs-on: xcode-27
    steps:
      - name: Configure Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27'
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-
      - name: Install Periphery
        run: brew install periphery
      - name: Lint code
        run: Scripts/lint-swift-code
      - name: Build index store
        # The default SwiftPM build system does not write an index store to the path that Periphery reads.
        run: >
          swift build --build-tests --build-system native --scratch-path .build/periphery
          -Xswiftc -index-store-path -Xswiftc "$PWD/.build/periphery-index"
      - name: Scan for dead code
        run: periphery scan --strict --config config/periphery.yml --skip-build --index-store-path "$PWD/.build/periphery-index"
